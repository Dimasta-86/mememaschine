<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meme Maschine</title>
  <meta name="theme-color" content="#0f1020">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <style>
    :root {
      --bg: #0f1020;
      --bg-2: #1b1d45;
      --panel: #1a1c3d;
      --text: #f4f4ff;
      --muted: #a3a6d6;
      --accent: #4f46ff;
      --accent-2: #8b5cf6;
      --ok: #2ecc71;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a2d7a 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      background-color: var(--bg);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow-x: hidden;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 16px calc(110px + env(safe-area-inset-bottom));
    }

    /* ---------- Kopfzeile ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 36px);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #b9b4ff 50%, #7dd3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .secret-badge {
      font-size: 18px;
      margin-left: 6px;
      opacity: 0;
      transition: opacity .6s;
      vertical-align: middle;
    }
    .secret-badge.found { opacity: .55; }

    .icon-btn {
      width: 48px; height: 48px;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.15); }
    .icon-btn:active { transform: scale(.92); }
    .icon-btn img { width: 26px; height: 26px; }

    /* ---------- Sound-Raster ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(5, 1fr); }
    }

    .tile {
      --h: 240;
      --p: 0;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: var(--radius);
      padding: 8px;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(160deg, hsl(var(--h) 75% 52%), hsl(calc(var(--h) + 25) 70% 34%));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 6px 0 hsl(calc(var(--h) + 25) 60% 20%),
        0 10px 20px rgba(0,0,0,.35);
      transition: transform .08s, box-shadow .08s, filter .2s;
      font: inherit;
    }

    .tile:hover { filter: brightness(1.1); }

    .tile:active, .tile.pressed {
      transform: translateY(5px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 1px 0 hsl(calc(var(--h) + 25) 60% 20%),
        0 4px 10px rgba(0,0,0,.35);
    }

    .tile:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    /* Fortschrittsbalken beim Abspielen */
    .tile::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 5px;
      background: rgba(255,255,255,.9);
      transform-origin: left;
      transform: scaleX(var(--p));
      opacity: 0;
    }
    .tile.playing::after { opacity: 1; }
    .tile.playing {
      filter: brightness(1.15);
      animation: wobble .5s ease-in-out infinite alternate;
    }

    @keyframes wobble {
      from { rotate: -1.5deg; }
      to   { rotate: 1.5deg; }
    }

    .tile .emoji {
      font-size: clamp(26px, 7vw, 40px);
      line-height: 1;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
    }

    .tile .label {
      font-weight: 700;
      font-size: clamp(11px, 2.8vw, 15px);
      line-height: 1.15;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
      overflow-wrap: anywhere;
    }

    .tile .key {
      position: absolute;
      top: 6px; left: 8px;
      font-size: 11px;
      font-weight: 700;
      opacity: .6;
      font-family: ui-monospace, Consolas, monospace;
    }
    body.hide-keys .key, body.hide-keys .random-key { display: none; }

    /* ---------- Zufalls-Button ---------- */
    .random-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
      gap: 10px;
    }

    .random-btn {
      position: relative;
      width: 130px; height: 130px;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      border-radius: 50%;
      transition: transform .15s;
    }
    .random-btn img {
      width: 100%; height: 100%;
      filter: drop-shadow(0 10px 20px rgba(46, 204, 113, .35));
      pointer-events: none;
    }
    .random-btn:hover { transform: scale(1.05); }
    .random-btn:active { transform: scale(.94); }
    .random-btn:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
    .random-btn.spin img { animation: spin .6s cubic-bezier(.3, 1.6, .5, 1); }
    .random-btn.playing::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid var(--ok);
      animation: pulse 1s ease-out infinite;
    }

    @keyframes spin {
      from { transform: rotate(0) scale(.85); }
      to   { transform: rotate(360deg) scale(1); }
    }
    @keyframes pulse {
      from { transform: scale(.9); opacity: 1; }
      to   { transform: scale(1.25); opacity: 0; }
    }

    .random-caption { color: var(--muted); font-size: 14px; }
    .random-key {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255,255,255,.1);
      margin-left: 4px;
    }

    /* ---------- Now-Playing-Leiste ---------- */
    .now-playing {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translate(-50%, 150%);
      width: min(520px, calc(100% - 32px));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px 10px 16px;
      background: rgba(26, 28, 61, .92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      transition: transform .3s cubic-bezier(.2, 1.3, .4, 1);
      z-index: 10;
    }
    .now-playing.show { transform: translate(-50%, 0); }
    .now-playing .np-emoji { font-size: 24px; }
    .now-playing .np-text { flex: 1; min-width: 0; }
    .now-playing .np-title {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-playing .np-bar {
      height: 4px;
      margin-top: 6px;
      border-radius: 2px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
    }
    .now-playing .np-bar > div {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), #7dd3fc);
      transform-origin: left;
      transform: scaleX(0);
    }
    .stop-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: #e5484d;
      cursor: pointer;
    }
    .stop-btn:active { transform: scale(.95); }

    /* ---------- Einstellungen ---------- */
    dialog {
      width: min(420px, calc(100% - 32px));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 20px;
      color: var(--text);
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    dialog::backdrop { background: rgba(5, 6, 20, .6); backdrop-filter: blur(3px); }
    dialog h2 { margin: 0 0 16px; font-size: 20px; }
    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .setting small { display: block; color: var(--muted); margin-top: 2px; }
    .setting input[type="range"] { width: 150px; accent-color: var(--accent); }
    .setting input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
    .dialog-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    .primary-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    /* ---------- Toast & Easter-Egg-Effekte ---------- */
    .toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -150%);
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(26, 28, 61, .95);
      border: 1px solid rgba(255,255,255,.12);
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      transition: transform .35s cubic-bezier(.2, 1.3, .4, 1);
      z-index: 20;
      max-width: calc(100% - 32px);
      text-align: center;
    }
    .toast.show { transform: translate(-50%, 0); }
    .toast.secret {
      background: linear-gradient(90deg, #f59e0b, #ef4444, #8b5cf6);
      border-color: transparent;
    }

    .flyer {
      position: fixed;
      pointer-events: none;
      font-size: 32px;
      z-index: 30;
      animation: fly 1.6s ease-out forwards;
    }
    @keyframes fly {
      from { transform: translate(0, 0) rotate(0) scale(.5); opacity: 1; }
      to   { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1.2); opacity: 0; }
    }

    body.shake { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      opacity: .7;
    }

    @media (max-width: 420px) {
      .grid { gap: 8px; }
      .tile { border-radius: 12px; padding: 4px; }
      .tile .key { display: none; }
    }

    @media (hover: none) {
      .key, .random-key { display: none; }
      footer .kbd-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile.playing, .random-btn.spin img, .random-btn.playing::before, body.shake, .flyer { animation: none; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div><h1 style="display:inline">Meme Maschine</h1><span class="secret-badge" id="secretBadge" title="Du weißt Bescheid 😉">🚪</span></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
        <img src="img/menu.png" alt="">
      </button>
    </header>

    <main>
      <div class="grid" id="grid"></div>

      <div class="random-wrap">
        <button class="random-btn" id="randomBtn" aria-label="Zufälliger Sound">
          <img src="img/start.png" alt="">
        </button>
        <div class="random-caption">Zufall <span class="random-key">Leertaste</span></div>
      </div>
    </main>

    <footer>
      <span class="kbd-hint">Tasten stehen oben links auf den Kacheln · Leertaste = Zufall · Esc = Stopp</span>
    </footer>
  </div>

  <div class="now-playing" id="nowPlaying" aria-live="polite">
    <span class="np-emoji" id="npEmoji">🔊</span>
    <div class="np-text">
      <div class="np-title" id="npTitle"></div>
      <div class="np-bar"><div id="npBar"></div></div>
    </div>
    <button class="stop-btn" id="stopBtn">Stopp</button>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <dialog id="settings">
    <h2>Einstellungen</h2>

    <label class="setting">
      <span>Lautstärke</span>
      <input type="range" id="volume" min="0" max="1" step="0.05">
    </label>

    <label class="setting">
      <span>Sounds überlagern<small>Mehrere Sounds gleichzeitig abspielen</small></span>
      <input type="checkbox" id="overlap">
    </label>

    <label class="setting">
      <span>Tastenkürzel anzeigen</span>
      <input type="checkbox" id="showKeys">
    </label>

    <label class="setting">
      <span>Vibration<small>Kurzes Feedback beim Antippen (Android)</small></span>
      <input type="checkbox" id="haptics">
    </label>

    <div class="dialog-actions">
      <button class="primary-btn" id="closeSettings">Fertig</button>
    </div>
  </dialog>

  <script>
    // ============================================================
    //  Alle Sounds an EINER Stelle. Neuer Sound = eine neue Zeile.
    //  h = Farbton der Kachel (0–360)
    // ============================================================
    const SOUNDS = [
      { label: 'Garnix',           file: 'audio/garnix.m4a',                         emoji: '🤷', h: 220 },
      { label: 'Brother ugh',      file: 'audio/Brother ueh.mp4',                    emoji: '😩', h: 245 },
      { label: 'Dog',              file: 'audio/What the Dog.mp4',                   emoji: '🐶', h: 30  },
      { label: 'WTH',              file: 'audio/What the Hell.mp4',                  emoji: '😳', h: 0   },
      { label: 'Schnusepiep',      file: 'audio/Schnusepiep.mp4',                    emoji: '🐭', h: 300 },
      { label: 'Go again',         file: 'audio/Ah Shit hear we go again.mp4',       emoji: '😮‍💨', h: 20 },
      { label: 'Ewe Dude',         file: 'audio/Ewe Dude WTF.mp4',                   emoji: '🤢', h: 110 },
      { label: 'In this moment',   file: 'audio/He Fucked up.mp4',                   emoji: '💀', h: 270 },
      { label: 'Noo',              file: 'audio/No God Please no.mp4',               emoji: '😱', h: 195 },
      { label: 'Okay',             file: 'audio/Okay.mp4',                           emoji: '👌', h: 150 },
      { label: 'Gay',              file: 'audio/Why are you Gay.mp4',                emoji: '🌈', h: 320 },
      { label: 'Karsten',          file: 'audio/Was ist denn mit Karsten los.mp4',   emoji: '🤨', h: 45  },
      { label: 'Emotional damage', file: 'audio/Emotional damage.mp4',               emoji: '💔', h: 345 },
      { label: 'Wa labascht du',   file: 'audio/Was juckt mich des.mp4',             emoji: '🙄', h: 175 },
      { label: 'Alarm',            file: 'audio/Alarm.mp4',                          emoji: '🚨', h: 10  },
      { label: 'Nuggets',          file: 'audio/Chicken nuggets.mp4',                emoji: '🍗', h: 38  },
      { label: 'Kranpätze',        file: 'audio/Kranpätze.mp4',                      emoji: '🏗️', h: 50  },
      { label: 'Warum',            file: 'audio/Warum.mp4',                          emoji: '❓', h: 260 },
      { label: 'Was machen Sachen',file: 'audio/was machen sachen.mp4',              emoji: '🤔', h: 130 },
      { label: 'Denkmal der Dummheit', file: 'audio/Denkmal der dummheit.mp4',       emoji: '🗿', h: 200 },
      { label: 'Wait a minute',    file: 'audio/whait a minute.mp4',                 emoji: '⏱️', h: 285 },
      { label: 'Nice',             file: 'audio/Nice.mp4',                           emoji: '😎', h: 160 },
      { label: 'Super',            file: 'audio/Super.mp4',                          emoji: '👍', h: 95  },
      { label: 'Unfall',           file: 'audio/Unfall.mp4',                         emoji: '💥', h: 5   },
      { label: 'Der Gäreät',       file: 'audio/der Gäreät.mp4',                     emoji: '📟', h: 230 },
      { label: 'Nein doch oh',     file: 'audio/nein doch oh.mp4',                   emoji: '😧', h: 335 },
      { label: 'Fahrräder',        file: 'audio/Fahrräder.mp4',                      emoji: '🚲', h: 140 },
      { label: 'Forca ist runtergeladen', file: 'audio/forca ist runtergeladen.mp4', emoji: '💾', h: 210 },
      { label: 'Halt stop',        file: 'audio/halt stop.mp4',                      emoji: '🛑', h: 355 },
      { label: 'Hünhen mit Reis',  file: 'audio/hünhen mit reis.mp4',                emoji: '🍚', h: 40  },
    ];

    // 🤫 Easter Egg: kommt NUR über den Zufalls-Button.
    const SECRET = { label: 'Ich muss raus', file: 'audio/Ich muss raus.mp4', emoji: '🚪', secret: true };

    // Tastenbelegung nach physischer Position (funktioniert auf QWERTZ & QWERTY)
    const KEY_CODES = [
      'Digit1', 'Digit2', 'Digit3', 'Digit4',
      'KeyQ',   'KeyW',   'KeyE',   'KeyR',
      'KeyA',   'KeyS',   'KeyD',   'KeyF',
      'KeyZ',   'KeyX',   'KeyC',   'KeyV',   // KeyZ = „Y“ auf deutscher Tastatur
      'KeyG',   'KeyH',   'KeyJ',   'KeyK',
      'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0',
      'KeyT',   'KeyU',   'KeyI',   'KeyO',   'KeyP',
    ];
    const KEY_LABELS = ['1','2','3','4','Q','W','E','R','A','S','D','F','Y','X','C','V','G','H','J','K',
                        '5','6','7','8','9','0','T','U','I','O','P'];

    // ---------- Einstellungen (mit Fallback, falls localStorage blockiert ist) ----------
    const DEFAULTS = { volume: 1, overlap: false, showKeys: true, haptics: true, secretFound: false };
    const settings = { ...DEFAULTS };
    try {
      Object.assign(settings, JSON.parse(localStorage.getItem('mememaschine') || '{}'));
    } catch (e) { /* egal */ }
    function saveSettings() {
      try { localStorage.setItem('mememaschine', JSON.stringify(settings)); } catch (e) { /* egal */ }
    }

    // ---------- Audio vorladen, damit es beim ersten Tippen sofort knallt ----------
    for (const s of [...SOUNDS, SECRET]) {
      s.audio = new Audio(s.file);
      s.audio.preload = 'auto';
    }

    // ---------- Kacheln bauen ----------
    const grid = document.getElementById('grid');
    SOUNDS.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'tile';
      btn.style.setProperty('--h', s.h);
      btn.innerHTML = `
        <span class="key">${KEY_LABELS[i] || ''}</span>
        <span class="emoji">${s.emoji}</span>
        <span class="label">${s.label}</span>`;
      btn.addEventListener('click', () => play(s, btn));
      s.el = btn;
      grid.appendChild(btn);
    });

    const randomBtn = document.getElementById('randomBtn');
    SECRET.el = randomBtn;

    // ---------- Abspielen ----------
    const active = new Set();   // { sound, audio, el }
    let lastRandom = null;

    function play(sound, el) {
      if (!settings.overlap) stopAll();
      randomBtn.classList.remove('playing'); // playRandom setzt es bei Bedarf wieder

      // Bei Überlagerung eine Kopie benutzen, sonst das vorgeladene Element
      const audio = settings.overlap ? sound.audio.cloneNode() : sound.audio;
      audio.currentTime = 0;
      audio.volume = settings.volume;

      const entry = { sound, audio, el };
      active.add(entry);
      el.classList.add('playing');
      showNowPlaying(sound);

      if (settings.haptics && navigator.vibrate) navigator.vibrate(15);

      audio.onended = () => finish(entry);
      audio.play().catch((err) => {
        if (err && err.name === 'AbortError') return; // wurde absichtlich gestoppt
        finish(entry);
        toast('😬 Sound konnte nicht abgespielt werden');
      });

      tick();
    }

    function finish(entry) {
      if (!active.delete(entry)) return; // schon erledigt
      entry.audio.pause();
      if (![...active].some(e => e.el === entry.el)) {
        entry.el.classList.remove('playing');
        entry.el.style.setProperty('--p', 0);
      }
      if (active.size === 0) hideNowPlaying();
    }

    function stopAll() {
      for (const entry of [...active]) {
        entry.audio.pause();
        entry.audio.currentTime = 0;
        finish(entry);
      }
    }

    function playRandom() {
      const pool = [...SOUNDS, SECRET].filter(s => s !== lastRandom); // nie zweimal hintereinander dasselbe
      const pick = pool[Math.floor(Math.random() * pool.length)];
      lastRandom = pick;

      randomBtn.classList.remove('spin');
      void randomBtn.offsetWidth; // Animation neu starten
      randomBtn.classList.add('spin');

      // Der Zufalls-Button leuchtet, die passende Kachel wackelt mit
      play(pick, pick.secret ? randomBtn : pick.el);
      if (!pick.secret) randomBtn.classList.add('playing');

      if (pick.secret) {
        easterEgg();
      } else {
        toast(`🎲 ${pick.emoji} ${pick.label}`);
      }
    }

    // ---------- Fortschrittsanzeige ----------
    let ticking = false;
    function tick() {
      if (ticking) return;
      ticking = true;
      const loop = () => {
        if (active.size === 0) {
          ticking = false;
          randomBtn.classList.remove('playing');
          return;
        }
        let newest = null;
        for (const e of active) {
          const p = e.audio.duration ? e.audio.currentTime / e.audio.duration : 0;
          e.el.style.setProperty('--p', p);
          newest = e;
        }
        if (newest) {
          const d = newest.audio.duration;
          npBar.style.transform = `scaleX(${d ? newest.audio.currentTime / d : 0})`;
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }

    // ---------- Now-Playing-Leiste ----------
    const nowPlaying = document.getElementById('nowPlaying');
    const npTitle = document.getElementById('npTitle');
    const npEmoji = document.getElementById('npEmoji');
    const npBar = document.getElementById('npBar');

    function showNowPlaying(sound) {
      npTitle.textContent = sound.secret ? '???' : sound.label;
      npEmoji.textContent = sound.secret ? '🤫' : sound.emoji;
      nowPlaying.classList.add('show');
    }
    function hideNowPlaying() {
      nowPlaying.classList.remove('show');
      npBar.style.transform = 'scaleX(0)';
    }
    document.getElementById('stopBtn').addEventListener('click', stopAll);

    // ---------- Toast ----------
    const toastEl = document.getElementById('toast');
    let toastTimer;
    function toast(text, secret = false) {
      toastEl.textContent = text;
      toastEl.classList.toggle('secret', secret);
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), secret ? 3500 : 1600);
    }

    // ---------- 🤫 Easter Egg ----------
    const secretBadge = document.getElementById('secretBadge');
    if (settings.secretFound) secretBadge.classList.add('found');

    function easterEgg() {
      const first = !settings.secretFound;
      settings.secretFound = true;
      saveSettings();
      secretBadge.classList.add('found');

      toast(first ? '🚪 Geheimer Sound gefunden!' : '🚪 Schon wieder raus?!', true);

      document.body.classList.remove('shake');
      void document.body.offsetWidth;
      document.body.classList.add('shake');

      // Türen fliegen aus dem Zufalls-Button
      const r = randomBtn.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const emojis = ['🚪', '🏃', '💨', '🚪', '🏃‍♂️', '🚪'];
      for (let i = 0; i < 18; i++) {
        const f = document.createElement('span');
        f.className = 'flyer';
        f.textContent = emojis[i % emojis.length];
        const angle = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 220;
        f.style.left = (cx - 16) + 'px';
        f.style.top = (cy - 16) + 'px';
        f.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        f.style.setProperty('--dy', Math.sin(angle) * dist - 80 + 'px');
        f.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 1700);
      }
    }

    randomBtn.addEventListener('click', playRandom);

    // ---------- Tastatur ----------
    document.addEventListener('keydown', (e) => {
      if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      if (document.getElementById('settings').open) return;

      if (e.code === 'Space') {
        e.preventDefault();
        playRandom();
        return;
      }
      if (e.code === 'Escape') {
        stopAll();
        return;
      }
      const i = KEY_CODES.indexOf(e.code);
      if (i !== -1 && SOUNDS[i]) {
        const s = SOUNDS[i];
        s.el.classList.add('pressed');
        setTimeout(() => s.el.classList.remove('pressed'), 120);
        play(s, s.el);
      }
    });

    // ---------- Einstellungs-Dialog ----------
    const dialog = document.getElementById('settings');
    const volumeEl = document.getElementById('volume');
    const overlapEl = document.getElementById('overlap');
    const showKeysEl = document.getElementById('showKeys');
    const hapticsEl = document.getElementById('haptics');

    function applySettings() {
      volumeEl.value = settings.volume;
      overlapEl.checked = settings.overlap;
      showKeysEl.checked = settings.showKeys;
      hapticsEl.checked = settings.haptics;
      document.body.classList.toggle('hide-keys', !settings.showKeys);
    }
    applySettings();

    document.getElementById('settingsBtn').addEventListener('click', () => dialog.showModal());
    document.getElementById('closeSettings').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

    volumeEl.addEventListener('input', () => {
      settings.volume = parseFloat(volumeEl.value);
      for (const e of active) e.audio.volume = settings.volume;
      saveSettings();
    });
    overlapEl.addEventListener('change', () => { settings.overlap = overlapEl.checked; saveSettings(); });
    showKeysEl.addEventListener('change', () => { settings.showKeys = showKeysEl.checked; saveSettings(); applySettings(); });
    hapticsEl.addEventListener('change', () => { settings.haptics = hapticsEl.checked; saveSettings(); });

    // ---------- Offline-Unterstützung (nur über http/https, nicht per Doppelklick auf die Datei) ----------
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
